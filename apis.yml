aid: 4dbim
name: 4DBIM
description: 4DBIM is the product brand of Beijing Yunjianxin Technology Co., Ltd. (北京云建信科技有限公司), a Beijing construction-technology
  company founded in 2015 that commercializes Tsinghua University 4D-BIM and BIM-FM research as a full-lifecycle
  Building Information Modeling platform for infrastructure. Its 4DBIM Cloud data centre combines a lightweight
  BIM+GIS graphics engine, multi-source model fusion and IoT ingestion on a microservice architecture, packaged
  as Power4D (construction management), Wonder4D (operations and maintenance), Skill4D (3D work instructions)
  and Smart4D (smart precast beam yards), plus a BIM consulting practice. It targets municipal and "national lifeline"
  infrastructure — metro, bridge, highway, tunnel and utility corridors — and has raised about USD 13.7M through
  a Series B. The 4DBIM Cloud page markets an "API开放平台" (API open platform), but 4DBIM publishes no developer
  portal, API reference or machine-readable contract, and www.4dbim.ren is an HTTP-only marketing site.
